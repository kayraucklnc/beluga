    </rect>
    <g opacity="0">
      <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" keyTimes="0;0.6667;0.7000;0.97;1" values="0;0;1;1;0"/>
      <text x="824" y="154" font-size="12.5" font-weight="600" fill="#2f8a4c">✓ ready to merge</text>
