  <text x="107" y="165" text-anchor="middle" font-size="11" fill="#8e8e93">main stays untouched</text>
  
  <path d="M 190 150 C 260 150, 250 70, 320 70" fill="none" stroke="#c7c7cc" stroke-width="2"/>
  <rect x="320" y="48" width="620" height="44" rx="10" fill="#ffffff" stroke="#e1e1e6"/>
  <text x="338" y="74.5" font-size="13" font-weight="600" fill="#1d1d1f">🌿 add-auth</text>
