<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One project, a worktree per task: add-auth, fix-webhooks and new-hero each get their own folder, branch and Claude, all working at once, each ready to merge when done.">
  <rect width="960" height="300" rx="18" fill="#f6f6f8"/>
  <rect x="24" y="118" width="166" height="64" rx="12" fill="#ffffff" stroke="#e1e1e6"/>
