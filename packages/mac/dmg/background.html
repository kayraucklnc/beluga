<!doctype html>
<!-- The install window's background (660×420 points). Rendered to background.png / @2x by scripts/make-dmg.mjs. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:660px;height:420px;overflow:hidden;background:#0e0f12}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;position:relative}
  .glow{position:absolute;inset:0;background:
    radial-gradient(520px 260px at 50% 118%, rgba(229,140,108,.22), transparent 70%),
    radial-gradient(420px 220px at 12% -10%, rgba(120,140,190,.18), transparent 70%),
    linear-gradient(180deg,#17181c 0%,#0e0f12 100%)}
  .grain{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(#fff 0.5px,transparent 0.6px);background-size:3px 3px}
  .head{position:absolute;top:30px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px;color:#f5f5f7}
  .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(180deg,#2a2c31,#0f1013);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 6px 16px rgba(0,0,0,.45);display:grid;place-items:center}
  .word{font-size:26px;font-weight:650;letter-spacing:-.4px}
  .sub{position:absolute;top:74px;left:0;right:0;text-align:center;color:rgba(235,235,245,.55);font-size:13px;letter-spacing:.1px}
  /* Soft light under each icon, and a frosted tag behind each name: Finder draws names white in
     dark mode and black in light mode, and both read on these. */
  .spot{position:absolute;width:190px;height:190px;border-radius:50%;top:112px;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 68%)}
  .tag{position:absolute;top:268px;height:22px;border-radius:11px;background:rgba(160,162,170,.62);box-shadow:inset 0 .5px 0 rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.25)}
  svg.arrow{position:absolute;left:0;top:0}
  .foot{position:absolute;bottom:62px;left:0;right:0;text-align:center;color:rgba(235,235,245,.78);font-size:13.5px;font-weight:500}
  .foot b{color:#fff;font-weight:650}
  .note{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:rgba(235,235,245,.38);font-size:11px}
</style></head><body>
  <div class="glow"></div><div class="grain"></div>
  <div class="head">
    <div class="mark"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 6.5l5 4.5-5 4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="11.5" y="14.2" width="6.5" height="2.4" rx="1.2" fill="#E58C6C"/></svg></div>
    <div class="word">Klaud</div>
  </div>
  <div class="sub">Your projects, your friends, and everyone's Claude</div>
  <div class="spot" style="left:95px"></div><div class="spot" style="left:375px"></div>
  <div class="tag" style="left:146px;width:88px"></div><div class="tag" style="left:425px;width:90px"></div>
  <!-- Icons are placed by Finder at (190, 205) and (470, 205), 112 pt. The arrow runs between them. -->
  <svg class="arrow" width="660" height="420" viewBox="0 0 660 420">
    <defs>
      <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient>
      <filter id="s" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>
    </defs>
    <g filter="url(#s)" fill="none" stroke="url(#a)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M268 190 C 305 160, 355 160, 392 190" stroke-dasharray="1 9"/>
      <path d="M380 178 L393 191 L378 200"/>
    </g>
  </svg>
  <div class="foot">Drag <b>Klaud</b> into <b>Applications</b> to install</div>
  <div class="note">First time: right-click Klaud in Applications and choose Open</div>
</body></html>
