// Beluga Link (BLG-377): a small app of its own with the Accessibility service, built
// beside the Beluga app (plugins/phone-control-addon.js adds it to the generated android project),
// with the same version and the same signing key, which is how the two trust each other.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def expo = new groovy.json.JsonSlurper().parse(file('../../../app.json')).expo

android {
  namespace 'sh.ratel.beluga.addon'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId 'sh.ratel.beluga.control'
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode expo.android.versionCode
    versionName expo.version
  }
  signingConfigs {
    // Release builds: Beluga's own key, as the app's (plugins/release-signing.js, BLG-430).
    if (System.getenv('BELUGA_ANDROID_KEYSTORE')) {
      release {
        storeFile file(System.getenv('BELUGA_ANDROID_KEYSTORE'))
        storePassword System.getenv('BELUGA_ANDROID_KEY_PASSWORD')
        keyAlias System.getenv('BELUGA_ANDROID_KEY_ALIAS') ?: 'beluga'
        keyPassword System.getenv('BELUGA_ANDROID_KEY_PASSWORD')
      }
    }
    debug {
      storeFile rootProject.file('app/debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }
  buildTypes {
    debug { signingConfig signingConfigs.debug }
    release { signingConfig System.getenv('BELUGA_ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug }
  }
  sourceSets {
    main.java.srcDirs += '../shared'
  }
}
