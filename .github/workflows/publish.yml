name: Publish to npm

# Every merge to main releases klaud to npm as `klaudcode`.
# If the version in package.json is already on npm, the patch number is bumped
# (0.4.0 -> 0.4.1) and the bump is committed back to main. To ship a minor or
# major release, set the new version in package.json in your PR.
#
# Auth is npm trusted publishing (OIDC), so no npm token is stored in the repo.
# One-time setup on npmjs.com: klaudcode -> Settings -> Trusted publisher ->
# GitHub Actions, owner kayraucklnc, repository klaud, workflow publish.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in merge order.
concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write # push the version bump commit and tag
  id-token: write # trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Pick a version that isn't on npm yet
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          published=$(npm view "$name" versions --json 2>/dev/null || echo '[]')
          bumped=false
          while node -e "process.exit([].concat($published).includes(require('./package.json').version) ? 0 : 1)"; do
            npm version patch --no-git-tag-version > /dev/null
            bumped=true
          done
          version=$(node -p "require('./package.json').version")
          echo "Releasing $name@$version (bumped: $bumped)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --provenance --access public

      - name: Commit the version bump and tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMPED: ${{ steps.version.outputs.bumped }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMPED" = "true" ]; then
            git commit -am "chore: release v$VERSION [skip ci]"
            git pull --rebase origin main
          fi
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

  # The Mac app, the same version, on the GitHub Release (signed and notarized when the Apple
  # secrets are set: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
  # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID).
  mac:
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.publish.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci
        working-directory: packages/mac
      - name: Use the release's version in the app
        working-directory: packages/mac
        run: |
          VERSION=${{ needs.publish.outputs.version }}
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Bundle klaud's daemon and Node
        run: node scripts/build-sidecar.mjs --arch arm64
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/mac
          tagName: v${{ needs.publish.outputs.version }}
          releaseName: klaud ${{ needs.publish.outputs.version }}
          releaseBody: 'klaud for macOS (Apple silicon). The terminal app: npm i -g klaudcode'
          args: --bundles dmg
