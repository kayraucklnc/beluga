name: CI

# Every pull request: the types check and the tests pass (the terminal UI and the core).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # The types check covers the Mac app's shared files too (its Markdown pipeline).
      - run: npm ci
        working-directory: packages/mac
      - run: npm run typecheck
      - run: npm test
