name: CI

# Every pull request: the types check and the tests pass (the terminal UI and the core), on
# Linux, macOS and Windows.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is new (BLG-523): its failures show, but don't block a merge until it's green once.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      # The tests read files byte for byte: no CRLF from Windows' checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # The types check covers the Mac app's shared files too (its Markdown pipeline).
      - run: npm ci
        working-directory: packages/mac
      - run: npm run typecheck
      - run: npm test
