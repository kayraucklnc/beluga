name: Desktop app on Linux and Windows

# Every pull request: the native shell compiles, passes clippy and its tests on Linux and Windows
# (macOS is mac.yml). Placeholders stand in for the bundled daemon and Node.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux's web view and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mac/src-tauri
      - name: Placeholders for the web view build, the bundled daemon and Node
        working-directory: packages/mac
        run: |
          mkdir -p dist src-tauri/binaries src-tauri/resources/daemon
          echo '<!doctype html>' > dist/index.html
          touch src-tauri/resources/daemon/.keep
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          cp "$(which node)" "src-tauri/binaries/node-${{ matrix.triple }}$ext"
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: packages/mac/src-tauri
      - run: cargo test
        working-directory: packages/mac/src-tauri
