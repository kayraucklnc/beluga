name: Release for Linux and Windows

# When the Mac release is published (scripts/release-mac.mjs makes it), or by hand for a tag:
# build Beluga for Linux (AppImage, deb, rpm) and Windows (installer), put them on the same
# release, and add both to its latest.json so installed copies update themselves.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (v1.9.0-mac)
        required: true
      updates:
        description: Sign the updates (needs the TAURI_SIGNING_PRIVATE_KEY secrets to match the Mac's key); off, the installers can't update themselves
        type: boolean
        default: true
      linux:
        description: Linux packages to build
        default: deb,rpm,appimage

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    # Only the app's releases (CI's npm releases are tagged v<version> without -mac).
    if: github.event_name == 'workflow_dispatch' || endsWith(github.event.release.tag_name, '-mac')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The release scripts as this workflow has them (a re-run for an older tag gets their fixes)
        run: |
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- scripts/release-desktop.mjs scripts/release-mac.mjs scripts/build-sidecar.mjs
      - name: Linux's web view, tray and packaging libraries (and GStreamer's plugins, which the AppImage carries)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mac/src-tauri
      - run: npm ci
      - run: npm ci
        working-directory: packages/mac
      - name: Beluga's engine and Node, bundled
        if: runner.os != 'Windows'
        env:
          # Usage statistics only in a release (an ingest-only Ratel key): other runs build without them.
          BELUGA_TELEMETRY_URL: ${{ github.event_name == 'release' && secrets.BELUGA_TELEMETRY_URL || '' }}
          BELUGA_TELEMETRY_KEY: ${{ github.event_name == 'release' && secrets.BELUGA_TELEMETRY_KEY || '' }}
        run: node scripts/build-sidecar.mjs
      - name: Beluga's engine and Node, bundled (Windows)
        # PowerShell: its tar is Windows' own (Git Bash's GNU tar reads C:\ as a host).
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BELUGA_TELEMETRY_URL: ${{ github.event_name == 'release' && secrets.BELUGA_TELEMETRY_URL || '' }}
          BELUGA_TELEMETRY_KEY: ${{ github.event_name == 'release' && secrets.BELUGA_TELEMETRY_KEY || '' }}
        run: node scripts/build-sidecar.mjs
      - name: The app
        working-directory: packages/mac
        env:
          # Signed updates unless the run said not to (a release always signs them).
          TAURI_SIGNING_PRIVATE_KEY: ${{ (github.event_name == 'release' || inputs.updates) && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ (github.event_name == 'release' || inputs.updates) && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # ('0', not '': an empty string is false in an expression, so && '' || '1' always gave '1'.)
          UNSIGNED: ${{ (github.event_name == 'release' || inputs.updates) && '0' || '1' }}
          LINUX_BUNDLES: ${{ inputs.linux || 'deb,rpm,appimage' }}
          # linuxdeploy's strip is older than the binaries it strips (Node 24's): the AppImage skips it.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          args=(--verbose)
          [ "$RUNNER_OS" = Linux ] && args+=(--bundles "$LINUX_BUNDLES")
          [ "$UNSIGNED" = 1 ] && args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          npx tauri build "${args[@]}"
      - name: Why the AppImage failed (ldd on every binary in it)
        if: failure() && runner.os == 'Linux'
        working-directory: packages/mac/src-tauri/target/release/bundle/appimage
        run: |
          ls
          find . -type f -print0 | while IFS= read -r -d '' f; do
            head -c 4 "$f" 2>/dev/null | grep -q $'\x7fELF' || continue
            out=$(ldd "$f" 2>&1) || echo "LDD FAILS: $f :: $(file -b "$f") :: $out"
          done
      - run: node scripts/release-desktop.mjs collect --tag "$TAG" --out release-out
      - uses: actions/upload-artifact@v4
        with:
          name: beluga-${{ runner.os }}
          path: release-out

  # Beluga for a server (scripts/build-server.mjs): a tarball per system with Node inside, and
  # the script that installs it (curl -fsSL …/releases/latest/download/install.sh | sh).
  server:
    if: github.event_name == 'workflow_dispatch' || endsWith(github.event.release.tag_name, '-mac')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: x64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          # Built on Apple silicon for Intel Macs: npm fetches the x64 prebuilds, the script x64 Node.
          - { runner: macos-15, os: darwin, arch: x64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The install script as this workflow has it (a re-run for an older tag gets its fixes)
        run: |
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- scripts/install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: packages/mac
      - run: node scripts/build-server.mjs --os ${{ matrix.os }} --arch ${{ matrix.arch }} --out server-out
      - name: It installs and runs (where it was built for this computer)
        if: matrix.os != 'darwin' || matrix.arch == 'arm64'
        run: |
          BELUGA_DOWNLOAD_URL="file://$PWD/server-out/beluga-server-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" sh server-out/install.sh
          ~/.local/bin/beluga up
          ~/.local/bin/beluga status
          ~/.local/bin/beluga stop
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: server-out

  server-publish:
    needs: server
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: artifacts
          merge-multiple: true
      - run: gh release upload "$TAG" artifacts/beluga-server-*.tar.gz artifacts/install.sh --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Only the desktop builds: the server's files (each with its own install.sh) are server-publish's.
      - uses: actions/download-artifact@v4
        with:
          pattern: beluga-*
          path: artifacts
      - run: node scripts/release-desktop.mjs publish --tag "$TAG" --dir artifacts
